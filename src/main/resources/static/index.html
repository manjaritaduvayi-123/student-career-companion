<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Student Career Companion</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <!-- Header -->

    <div class="hero text-center mb-5">

        <div class="hero-icon">
            <i class="fas fa-graduation-cap"></i>
        </div>

        <h1>Smart Student Career Companion</h1>

        <p>
            AI-powered career guidance based on your skills and interests
        </p>

    </div>

    <!-- Form Card -->

    <div class="glass-card p-4 mb-4">

        <h4 class="section-title">
            Student Information
        </h4>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text"
                       id="name"
                       class="form-control"
                       placeholder="Enter your name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Branch</label>
                <input type="text"
                       id="branch"
                       class="form-control"
                       placeholder="CSE, ECE, IT">
            </div>

        </div>

        <div class="mb-4">
            <label class="form-label">Skills</label>
            <input type="text"
                   id="skills"
                   class="form-control"
                   placeholder="Java, Spring Boot, SQL, Python">
        </div>

        <button onclick="getCareer()" class="btn btn-custom w-100">

            <i class="fas fa-wand-magic-sparkles me-2"></i>
            Get Career Recommendation

        </button>

    </div>

    <!-- Result Card -->

    <div class="glass-card p-4">

        <h4 class="section-title">
            <i class="fas fa-rocket me-2"></i>
            Recommended Career Path
        </h4>

        <div id="result" class="result-box">

            <div class="placeholder-content">

                <i class="fas fa-lightbulb"></i>

                <p>
                    Enter your details and click the button to get AI career suggestions.
                </p>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
