<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Career Companion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <!-- HERO -->
    <div class="hero text-center">

        <h1>
            <i class="fa-solid fa-graduation-cap"></i>
            Smart Student Career Companion
        </h1>

        <p>
            AI-powered career guidance based on your skills
        </p>

    </div>

    <!-- FORM CARD -->
    <div class="glass-card p-4 mt-4">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Name</label>
                <input type="text"
                       id="name"
                       class="form-control"
                       placeholder="Enter your name">
            </div>

            <div class="col-md-6 mb-3">
                <label>Branch</label>
                <input type="text"
                       id="branch"
                       class="form-control"
                       placeholder="CSE, ECE, IT">
            </div>

        </div>

        <div class="mb-3">
            <label>Skills</label>
            <input type="text"
                   id="skills"
                   class="form-control"
                   placeholder="Java, Spring Boot, SQL">
        </div>

        <button onclick="getCareer()"
                class="btn btn-custom w-100">

            <i class="fa-solid fa-wand-magic-sparkles"></i>
            Get Career Recommendation

        </button>

    </div>

    <!-- RESULT CARD -->
    <div class="glass-card p-4 mt-4">

        <h3 class="career-title">
            🚀 Recommended Career Path
        </h3>

        <div id="result" class="result-box">

            Enter your details and click the button.

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
