<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Career Companion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="hero-section text-center mb-4">

        <h1 class="display-4 fw-bold text-primary">
            Smart Student Career Companion
        </h1>

        <p class="lead text-muted">
            Discover the best career path based on your skills
        </p>

    </div>

    <div class="card shadow-lg p-4 main-card">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input type="text"
                       id="name"
                       class="form-control"
                       placeholder="Enter your name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Branch</label>
                <input type="text"
                       id="branch"
                       class="form-control"
                       placeholder="CSE, ECE, IT">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Skills</label>
            <input type="text"
                   id="skills"
                   class="form-control"
                   placeholder="Java, Spring, SQL">
        </div>

        <button class="btn btn-primary btn-lg w-100"
                onclick="getCareer()">
            Get Recommendation
        </button>

    </div>

    <div class="card shadow-lg mt-4 p-4">

        <h3 class="text-success mb-3">
            Career Recommendation
        </h3>

        <div id="result" class="result-box">
            Enter your skills and click Get Recommendation.
        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
